app:
  baseUrl: http://localhost:8080

spring:
  application:
    name: dbem

  jwt:
    secret: efjeoapwgj5e6eajpgepjg8894e6Agrionawoidfjeoifag31awhoefeofja4aega45agrlkagjaejiognvlbnaio3je

  datasource:
    url: jdbc:postgresql://localhost:5400/dbem
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  batch:
    jdbc:
      initialize-schema: always

  redis:
    host: localhost
    port: 6300

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            redirect-uri: http://localhost:8080/login/oauth2/code/kakao
            authorization-grant-type: authorization_code
            scope: profile_nickname, account_email
            client-name: KAKAO

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

sendgrid:
  api-key: # ${SENDGRID_API_KEY}
  email: # ${SENDGRID_EMAIL}

public:
  api:
    base-url: http://apis.data.go.kr/1471000/DrbEasyDrugInfoService/getDrbEasyDrugList
    service-key: # ${PUBLIC_API_SERVICE_KEY}
