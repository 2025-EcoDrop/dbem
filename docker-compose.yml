version: "3.8"
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: pgv-postgres
    ports:
      - "5400:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: dbme
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6300:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data: